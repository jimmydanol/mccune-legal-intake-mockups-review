<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BK FastLane | Court Notice Automations Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="./court-notice-automations.css" rel="stylesheet">
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f6f7f5; }
    * { box-sizing: border-box; }
    html, body, #root { min-height: 100%; margin: 0; }
    body { background: #f6f7f5; color: #434343; }
    button, input, select, textarea { font: inherit; }
    .review-shell { min-height: 100vh; display: grid; grid-template-columns: 214px minmax(0, 1fr); }
    .review-sidebar { background: #26372b; color: #dce7de; padding: 22px 14px; position: sticky; top: 0; height: 100vh; }
    .review-brand { display: flex; align-items: center; gap: 10px; padding: 0 9px 22px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .review-mark { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 7px; background: #dbe8dd; color: #36513d; font-weight: 800; }
    .review-brand strong { display: block; font-size: 13px; color: #fff; }
    .review-brand small { display: block; margin-top: 2px; font-size: 8px; letter-spacing: .85px; color: #9fb3a4; }
    .review-nav-label { margin: 25px 10px 8px; font-size: 8px; font-weight: 800; letter-spacing: 1.25px; color: #819a88; }
    .review-nav-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-radius: 6px; padding: 10px 11px; background: transparent; color: #aebdb1; text-align: left; font-size: 11px; }
    .review-nav-item.active { background: rgba(201,224,206,.13); color: #f5faf6; font-weight: 700; }
    .review-nav-icon { width: 19px; text-align: center; font-size: 15px; }
    .review-sidebar-note { position: absolute; left: 14px; right: 14px; bottom: 18px; border: 1px solid rgba(255,255,255,.12); border-radius: 7px; padding: 10px; background: rgba(255,255,255,.04); }
    .review-sidebar-note strong { display: block; font-size: 9px; letter-spacing: .8px; color: #dce7de; }
    .review-sidebar-note span { display: block; margin-top: 4px; font-size: 8.5px; line-height: 1.45; color: #94a99a; }
    .review-main { min-width: 0; }
    .review-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 42px; padding: 8px 30px; border-bottom: 1px solid #e1e4df; background: #fff; color: #687169; font-size: 10px; }
    .review-banner strong { color: #45614c; letter-spacing: .55px; }
    .review-banner span:last-child { color: #8a6a29; }
    @media (max-width: 820px) {
      .review-shell { display: block; }
      .review-sidebar { height: auto; position: static; padding: 12px 14px; }
      .review-brand { border: 0; padding: 0; }
      .review-sidebar .review-nav-label, .review-sidebar .review-nav-item:not(.active), .review-sidebar-note { display: none; }
      .review-sidebar .review-nav-item.active { margin-top: 10px; }
      .review-banner { padding: 8px 18px; align-items: flex-start; flex-direction: column; gap: 3px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="./court-notice-automations.js"></script>
  <script>
    (function () {
      const seedMatters = [1, 2, 5, 7, 8, 9].map(function (id) {
        return { id: id, tasks: [], timeline: [] };
      });

      function ReviewApp() {
        const matterState = React.useState(seedMatters);
        return React.createElement(
          "div",
          { className: "review-shell" },
          React.createElement(
            "aside",
            { className: "review-sidebar", "aria-label": "CRM Lite navigation" },
            React.createElement(
              "div",
              { className: "review-brand" },
              React.createElement("span", { className: "review-mark", "aria-hidden": "true" }, "BK"),
              React.createElement("div", null,
                React.createElement("strong", null, "BK FastLane"),
                React.createElement("small", null, "CRM LITE · JIMMY BRANCH")
              )
            ),
            React.createElement("div", { className: "review-nav-label" }, "WORKFLOW REPORTS"),
            React.createElement("div", { className: "review-nav-item" },
              React.createElement("span", { className: "review-nav-icon", "aria-hidden": "true" }, "▦"), "Dashboard"
            ),
            React.createElement("div", { className: "review-nav-item" },
              React.createElement("span", { className: "review-nav-icon", "aria-hidden": "true" }, "◎"), "Leads"
            ),
            React.createElement("div", { className: "review-nav-item active", "aria-current": "page" },
              React.createElement("span", { className: "review-nav-icon", "aria-hidden": "true" }, "⚖"), "Court Notices"
            ),
            React.createElement("div", { className: "review-sidebar-note" },
              React.createElement("strong", null, "MATT REVIEW LINK"),
              React.createElement("span", null, "Scoped Court Notices prototype. No client records or production systems are connected.")
            )
          ),
          React.createElement(
            "section",
            { className: "review-main" },
            React.createElement("div", { className: "review-banner" },
              React.createElement("strong", null, "JIMMY BRANCH · COURT NOTICE AUTOMATIONS"),
              React.createElement("span", null, "Synthetic demo data · local browser storage · no messages sent")
            ),
            React.createElement(window.BKFLCourtNotices.CourtNoticesPage, {
              matters: matterState[0],
              setMatters: matterState[1]
            })
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ReviewApp));
    }());
  </script>
</body>
</html>
